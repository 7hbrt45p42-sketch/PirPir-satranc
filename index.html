<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>Pır Pır Satranç</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0907; overflow: hidden;
                 font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #140d0a; outline: none; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              background: radial-gradient(ellipse at center, #2a1a12 0%, #0d0907 70%); color: #fff; z-index: 10;
              transition: opacity .5s; }
    #loader h1 { margin: 0 0 6px; font-size: clamp(34px, 7vw, 72px); letter-spacing: 2px; text-shadow: 0 3px 0 #0a3a5a; }
    #loader h1 span { color: #ffe98c; }
    #loader p { margin: 0 0 28px; font-size: clamp(14px, 2.2vw, 22px); color: #b8e0ff; }
    #bar { width: min(420px, 70vw); height: 14px; border-radius: 8px; background: rgba(255,255,255,.12); overflow: hidden; }
    #fill { width: 0%; height: 100%; background: linear-gradient(90deg, #0aa89e, #1e73c2); transition: width .2s; }
    #msg { margin-top: 14px; font-size: 14px; color: #9fb4c4; }
    /* Oyun hazır olunca çıkan BAŞLA düğmesi (ilk ziyaret) */
    #startBtn { display: none; padding: 16px 64px; border-radius: 16px; border: 0; cursor: pointer;
                background: linear-gradient(180deg, #17b5a8, #0e8f86); color: #fff; font-size: clamp(22px, 3.4vw, 32px);
                font-weight: 800; letter-spacing: 2px; box-shadow: 0 6px 0 #096a63, 0 10px 28px rgba(0,0,0,.45);
                animation: pulse 1.6s ease-in-out infinite; }
    #startBtn:hover { filter: brightness(1.1); }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .small { position: fixed; bottom: 12px; z-index: 5; padding: 8px 14px; border-radius: 10px; border: 0;
             background: rgba(0,0,0,.45); color: #fff; font-size: 14px; cursor: pointer; }
    .small:hover { background: rgba(0,0,0,.7); }
    #fs { left: 14px; }
    #replay { left: 168px; display: none; }
    #err { position: fixed; left: 0; right: 0; bottom: 0; background: #a00; color: #fff; padding: 10px; display: none; z-index: 20; }
    /* Fragman katmanı */
    #intro { position: fixed; inset: 0; z-index: 30; background: #000; display: none; align-items: center; justify-content: center; }
    #introVideo { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #introSkip { position: absolute; right: 18px; bottom: 18px; padding: 12px 22px; border-radius: 12px; border: 2px solid rgba(255,255,255,.7);
                 background: rgba(0,0,0,.55); color: #fff; font-size: 18px; font-weight: 700; letter-spacing: 1px; cursor: pointer; }
    #introSkip:hover { background: rgba(255,255,255,.25); }
  </style>
</head>
<body>
  <canvas id="game" tabindex="-1"></canvas>
  <button id="fs" class="small" title="Tam ekran">Tam ekran &middot; v18</button>
  <button id="replay" class="small" title="Fragmanı izle">&#9654; Fragman</button>
  <div id="loader">
    <h1>PIR PIR <span>SATRANÇ</span></h1>
    <p>Her Hamlede Bir Hikâye!</p>
    <div id="bar"><div id="fill"></div></div>
    <button id="startBtn">BAŞLA</button>
    <div id="msg">Oyun yükleniyor... (ilk açılışta biraz sürebilir)</div>
  </div>
  <div id="err"></div>

  <!-- Açılış fragmanı: ilk ziyarette BAŞLA'dan sonra oynar, ATLA ile geçilir, ▶ Fragman ile yeniden izlenir -->
  <div id="intro">
    <video id="introVideo" src="fragman.mp4?v=14" playsinline preload="none"></video>
    <button id="introSkip" aria-label="Fragmanı atla">ATLA &#9654;&#9654;</button>
  </div>

  <script src="Build/WebGL.loader.js?v=18"></script>
  <script>
    var canvas = document.getElementById("game");
    var config = {
      arguments: [],
      dataUrl: "Build/WebGL.data.unityweb?v=18",
      frameworkUrl: "Build/WebGL.framework.js.unityweb?v=18",
      codeUrl: "Build/WebGL.wasm.unityweb?v=18",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Beylikduzu Belediyesi",
      productName: "Pir Pir Satranc",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: function (msg, type) {
        if (type === "error") { var e = document.getElementById("err"); e.style.display = "block"; e.innerHTML = msg; }
      }
    };

    // ---- Fragman akışı ----
    var SEEN_KEY = "pp_intro_seen";
    function introSeen() { try { return localStorage.getItem(SEEN_KEY) === "1"; } catch (e) { return false; } }
    function markSeen() { try { localStorage.setItem(SEEN_KEY, "1"); } catch (e) {} }

    var loader = document.getElementById("loader");
    var intro = document.getElementById("intro");
    var vid = document.getElementById("introVideo");
    var startBtn = document.getElementById("startBtn");
    var replayBtn = document.getElementById("replay");
    var skipBtn = document.getElementById("introSkip");
    var introOpen = false;

    function hideLoader() {
      loader.style.opacity = 0;
      setTimeout(function () { loader.style.display = "none"; }, 600);
    }
    function openIntro() {            // yalnızca tıklama içinden çağrılır (sesli oynatma izni)
      introOpen = true;
      intro.style.transition = "none";
      intro.style.opacity = 1;
      intro.style.display = "flex";
      try { vid.currentTime = 0; } catch (e) {}
      var p = vid.play();
      if (p && p.catch) p.catch(function () { closeIntro(); });   // oynatılamazsa oyuna geç
    }
    function closeIntro() {
      if (!introOpen) return;
      introOpen = false;
      markSeen();
      try { vid.pause(); } catch (e) {}
      intro.style.transition = "opacity .4s";
      intro.style.opacity = 0;
      setTimeout(function () { intro.style.display = "none"; canvas.focus(); }, 420);
    }

    skipBtn.addEventListener("click", function (e) { e.stopPropagation(); closeIntro(); });
    vid.addEventListener("ended", closeIntro);
    vid.addEventListener("error", function () { introOpen = true; closeIntro(); });   // fragman açılmazsa oyuna geç
    window.addEventListener("keydown", function (e) {
      if (!introOpen) return;
      if (e.key === "Escape" || e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); closeIntro(); }
    }, true);

    startBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      hideLoader();
      openIntro();
    });
    replayBtn.addEventListener("click", function (e) { e.stopPropagation(); openIntro(); });

    // ---- Oyunu yükle ----
    var instance = null;
    createUnityInstance(canvas, config, function (progress) {
      document.getElementById("fill").style.width = (100 * progress) + "%";
      if (progress >= 0.999) document.getElementById("msg").textContent = "Başlatılıyor...";
    }).then(function (u) {
      instance = u;
      replayBtn.style.display = "block";
      vid.preload = "auto";           // oyun hazır, fragmanı arka planda indirmeye başla
      vid.load();
      if (introSeen()) {              // daha önce izlediyse doğrudan oyuna
        hideLoader();
        canvas.focus();
      } else {                        // ilk ziyaret: BAŞLA düğmesi çıksın
        document.getElementById("bar").style.display = "none";
        document.getElementById("msg").style.display = "none";
        startBtn.style.display = "block";
      }
    }).catch(function (m) {
      document.getElementById("msg").textContent = "Oyun açılamadı: " + m;
    });
    document.getElementById("fs").onclick = function () { if (instance) instance.SetFullscreen(1); };
    // Oyun penceresine tıklayınca klavye odağı oyuna geçsin
    window.addEventListener("click", function () { if (!introOpen) canvas.focus(); });
  </script>
</body>
</html>
